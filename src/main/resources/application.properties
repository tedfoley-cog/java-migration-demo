# =============================================================================
# ACME Insurance Platform — Application Configuration
# =============================================================================

# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:insurancedb;MODE=LEGACY;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# SQL initialization (deferred so data.sql runs after JPA schema generation)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Insurance business configuration (externalized from Constants.java)
insurance.premium-tax-rate=0.035
insurance.late-payment-penalty-rate=0.10
insurance.grace-period-days=30
insurance.policy-number-prefix=POL
insurance.claim-number-prefix=CLM
insurance.high-value-claim-threshold=50000.00

# Logging
logging.level.com.acme.insurance=INFO
logging.level.org.hibernate.SQL=WARN
